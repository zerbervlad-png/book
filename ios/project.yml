# XcodeGen spec — run `xcodegen` in this folder (setup.sh does it for you).
# Generates AccessMarketplace.xcodeproj with all sources and Info.plist keys.
name: AccessMarketplace
options:
  bundleIdPrefix: com.accessmarketplace
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  AccessMarketplace:
    type: application
    platform: iOS
    sources:
      - AccessMarketplace
    info:
      path: AccessMarketplace/Info.plist
      properties:
        CFBundleDisplayName: AccessMarketplace
        UILaunchScreen: {}
        NSCameraUsageDescription: Scan QR codes for event check-in
        # Dev backend runs over plain HTTP — local network only.
        # NSAllowsArbitraryLoads is a common App Review rejection; the local
        # networking exception covers LAN HTTP backends during development.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
